[sources.facts]
kind = "episodic"
store = "sqlite"
path = "memory.sqlite3"
capabilities = ["search", "list", "write", "update", "delete"]

[policies.recall]
enabled = true
profile = "main"
sources = ["facts"]
max_records = 10
timeout = 2.0

[policies.review]
enabled = true
capacity = 8
timeout = 10.0
max_records = 100
profile = "main"
sources = ["facts"]
max_iterations = 4
