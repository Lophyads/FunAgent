[definitions.echo]
description = "Echo a value without side effects"
handler = "echo"
[definitions.echo.parameters]
type = "object"
[definitions.echo.parameters.properties.value]
type = "string"

[definitions.read_workspace]
description = "Read a UTF-8 regular file up to 65536 bytes in the session workspace; requires approval for this call"
handler = "read_workspace"
requires_approval = true
[definitions.read_workspace.parameters]
type = "object"
required = ["path"]
additionalProperties = false
[definitions.read_workspace.parameters.properties.path]
type = "string"
minLength = 1
maxLength = 4096

[definitions.ask_user]
description = "Ask the user for clarification and resume this task with the answer"
handler = "ask_user"
[definitions.ask_user.parameters]
type = "object"
required = ["prompt"]
additionalProperties = false
[definitions.ask_user.parameters.properties.prompt]
type = "string"
minLength = 1
maxLength = 4000

[purposes]
main = ["echo", "read_workspace", "ask_user"]
recall = []
review = []
