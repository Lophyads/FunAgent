# Replace memory.conf with this file to use Cognee as the only facts/review store.
# Requires a running Cognee service and COGNEE_MEMORY_TOKEN in the environment.
# tool.conf: purposes.review = ["memory"]; grant memory.cognee.read for main recall,
# and memory.cognee.read/write to management if the management page is used.
[sources.cognee]
kind = "episodic"
store = "cognee"
endpoint = "http://127.0.0.1:8000/api/v1"
datasets = ["funagent-memory"]
credential_env = "COGNEE_MEMORY_TOKEN"
capabilities = ["search", "list", "write", "update", "delete"]
write_confirmation = "stored"
timeout = 120.0
read_access = "memory.cognee.read"
write_access = "memory.cognee.write"

[policies.recall]
profile = "primary"
timeout = 120.0

[policies.facts]
enabled = true
sources = ["cognee"]
max_records = 10
max_chars = 8000
timeout = 120.0

[policies.review]
enabled = true
every_turns = 3
profile = "primary"
sources = ["cognee"]
max_iterations = 5
max_records = 100
timeout = 300.0

[policies.profile]
enabled = false
