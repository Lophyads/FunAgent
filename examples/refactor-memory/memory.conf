[sources.facts]
kind = "episodic"
store = "sqlite"
path = "memory.sqlite3"
capabilities = ["search", "list", "write", "update", "delete"]
read_access = "memory.facts.read"
write_access = "memory.facts.write"

[sources.knowledge]
kind = "semantic"
store = "callback"
callback_id = "http_json"
endpoint = "http://127.0.0.1:8765/query"
capabilities = ["search"]
read_access = "memory.knowledge.read"
timeout = 1.0
# credential_env = "KNOWLEDGE_API_KEY"

[policies.recall]
enabled = true
profile = "main"
sources = ["facts", "knowledge"]
max_records = 10
max_iterations = 3
max_chars = 16000
timeout = 2.0

[policies.review]
profile = "main"
sources = ["facts"]
max_iterations = 4
