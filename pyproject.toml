[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "funagent"
version = "0.2.0"
description = "A single-process agent with durable tasks, shared memory, CLI and browser access"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jsonschema>=4.18,<5",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
openai = ["openai>=2.0,<3"]
siwc = ["openai>=2.54.0,<3", "httpx==0.28.1", "PyJWT[crypto]>=2.10,<3"]
embedding = ["httpx==0.28.1"]
rerank = ["httpx==0.28.1"]
supabase = ["httpx==0.28.1"]
cognee = ["httpx==0.28.1"]
supabase-test = ["psycopg[binary]==3.3.6"]
dev = ["pytest>=8.4,<10"]
mcp = [
    "mcp==1.30.0",
]
web = [
    "ddgs==9.16.0",
    "httpx==0.28.1",
    "pypdf==6.20.0",
]

[project.scripts]
funagent = "src.app.main:main"

[tool.hatch.build]
exclude = ["**/.env", "**/.env.*", "**/*.db", "**/*.db-*", "**/*.sqlite", "**/*.sqlite-*", "**/*.sqlite3", "**/*.sqlite3-*", "**/*.log", "**/*.log.*", "**/trace_json/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = ["/src", "/tests_refactor", "/tests_observability", "/tests/test_openai_provider.py", "/tests/test_openai_responses.py", "/tests/test_siwc_credentials.py", "/tests/test_responses_history.py", "/tests/test_siwc_lifecycle.py", "/scripts/verify_siwc_core.py", "/examples/siwc/model.conf", "/examples/refactor*", "/README.md", "/docs/*.md", "/pyproject.toml", "/uv.lock", "/hatch_build.py", "/workflows/memory-cognee/graph-engine/package.json", "/workflows/memory-cognee/graph-engine/package-lock.json", "/workflows/memory-cognee/graph-engine/build.mjs", "/workflows/memory-cognee/graph-engine/README.md"]

[tool.pytest.ini_options]
addopts = "-q -m 'not supabase_integration'"
markers = ["supabase_integration: requires an explicitly configured isolated Supabase database and RPC endpoint; missing environment is an error"]
testpaths = ["tests", "tests_refactor", "tests_observability", "evals/tests"]
pythonpath = ["."]
