[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "funagent"
version = "0.2.0"
description = "A single-process agent with durable tasks, shared memory, CLI and browser access"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
openai = ["openai>=2.0,<3"]
dev = ["pytest>=8.4,<10"]

[project.scripts]
funagent = "funagent.global_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/funagent"]

[tool.hatch.build.targets.sdist]
include = ["/src/funagent", "/tests_refactor", "/examples/refactor*", "/scripts", "/README.md", "/architecture/p7-implementation.md", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests_refactor"]
pythonpath = ["src"]
