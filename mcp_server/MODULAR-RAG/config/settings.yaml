# Modular RAG MCP Server — default configuration
# Auto-generated to satisfy the dashboard's ConfigService (Overview page).
# Adjust provider/model values to match your actual deployment.

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 4096
  api_key_env: OPENAI_API_KEY

embedding:
  provider: openai
  model: text-embedding-qwen3-embedding-4b
  dimensions: 2560
  api_key: LM-Studio
  base_url: http://127.0.0.1:1234/v1

vector_store:
  provider: chroma
  persist_directory: data/chroma_db
  collection_name: default

retrieval:
  dense_top_k: 10
  sparse_top_k: 10
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: false
  provider: none
  model: none
  top_k: 10

evaluation:
  enabled: false
  provider: ragas
  metrics:
    - faithfulness
    - answer_relevancy

observability:
  log_level: INFO
  trace_enabled: true
  trace_file: logs/traces.jsonl
  structured_logging: true

ingestion:
  chunk_size: 512
  chunk_overlap: 0
  splitter: paragraph
  batch_size: 32
  chunk_refiner:
    use_llm: false
